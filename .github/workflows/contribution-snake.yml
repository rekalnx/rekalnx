name: contribution graph

# Regenerates the animated contribution graph used in README.md and
# publishes it to the `output` branch. Runs daily, on push, or manually.
on:
  schedule:
    - cron: "17 0 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/workflows/contribution-snake.yml"]

permissions:
  contents: write

concurrency:
  group: contribution-snake
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Generate SVGs
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake-dark.svg?palette=github-dark&color_snake=#E8ECF2&color_dots=#11141B,#3A1A14,#6E2416,#B83119,#FF3B1F
            dist/snake-light.svg?palette=github-light&color_snake=#0B0D12&color_dots=#E9ECF1,#F7C6BC,#F08F7A,#E8573C,#E5341B

      - name: Publish to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
          keep_history: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
