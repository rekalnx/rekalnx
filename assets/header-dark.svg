    </circle>
  </g>
  <text x="1122" y="72" class="mono" font-size="13" fill="#E8ECF2" text-anchor="end">AVAILABLE</text>

  <text x="60" y="164" class="sans" font-size="66" font-weight="600" letter-spacing="-2" fill="#E8ECF2">Reihan Valentino Yudistira<tspan fill="#FF3B1F">.</tspan></text>

  <text x="64" y="208" class="mono" font-size="14" fill="#8B95A5">CYBER SECURITY  ·  BUG BOUNTY  ·  NETWORK &amp; SYSTEMS  ·  AI TOOLING</text>

