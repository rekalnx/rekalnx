<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="t d">
  <title id="t">Reihan Valentino Yudistira</title>
  <desc id="d">Security engineer and bug hunter from Indonesia</desc>
  <style>
    .mono { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; letter-spacing: 2.6px; }
    .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Helvetica, Arial, sans-serif; }
  </style>
  <rect width="1200" height="300" fill="#050608"/>
  <!-- 1px instrument frame -->
  <rect x="16.5" y="16.5" width="1167" height="267" fill="none" stroke="#E8ECF2" stroke-opacity="0.14"/>
  <!-- vermilion reticle corners -->
  <path d="M16.5 40 V16.5 H40" fill="none" stroke="#FF3B1F" stroke-width="1.5"/>
  <path d="M1183.5 260 V283.5 H1160" fill="none" stroke="#FF3B1F" stroke-width="1.5"/>
  <!-- side ticks -->
  <path d="M16.5 150 H28 M1171.5 150 H1183.5" stroke="#E8ECF2" stroke-opacity="0.4"/>

